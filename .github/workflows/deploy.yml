name: Deploy Website to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via SSH
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avzr --delete \
            --exclude='.git' --exclude='.github' --exclude='config.php' --exclude='admin/config.php' --exclude='admin/.login_attempts.json' \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u164306528/domains/acmpvtltd.com/public_html/
